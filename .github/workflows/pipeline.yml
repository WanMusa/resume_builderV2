name: Resume Pipeline (Stage 0 + Stage 1)

on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/*.csv'

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      has_csv: ${{ steps.filter.outputs.has_csv }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_csv=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push events, inspect changed files in this commit range
          CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD || true)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^incoming/.*\.csv$' >/dev/null; then
            echo "has_csv=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_csv=false" >> "$GITHUB_OUTPUT"
          fi

  read-csv:
    needs: changed-files
    if: needs.changed-files.outputs.has_csv == 'true'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.parse.outputs.run_id }}
      links: ${{ steps.parse.outputs.links_json }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: parse
        name: Parse CSV and seed runs/jobs
        run: python -m src.parse_csv >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  get-pending-jobs:
    needs: [changed-files, read-csv]
    if: needs.changed-files.outputs.has_csv == 'true'
    runs-on: ubuntu-latest
    outputs:
      job_ids: ${{ steps.query.outputs.ids_json }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: query
        run: python -m src.query_by_status --run-id "${{ needs.read-csv.outputs.run_id }}" --status pending >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  extract-job-scope:
    needs: [changed-files, get-pending-jobs]
    if: needs.changed-files.outputs.has_csv == 'true'
    strategy:
      fail-fast: false
      matrix:
        job_id: ${{ fromJson(needs.get-pending-jobs.outputs.job_ids) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Show Copilot version
        run: copilot --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract scope for one job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.extract_job_scope --job-id "${{ matrix.job_id }}"

  finalize-run:
    needs: [changed-files, read-csv, extract-job-scope]
    if: always() && needs.changed-files.outputs.has_csv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Finalize run status from DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RUN_ID: ${{ needs.read-csv.outputs.run_id }}
        run: |
          python - <<'PY'
          from src.db import get_jobs_by_status, finish_run
          import os

          run_id = os.environ["RUN_ID"]
          failed = get_jobs_by_status(run_id, "failed")
          status = "failed" if failed else "completed"
          finish_run(run_id, status)
          print(f"Run {run_id} finalized as {status}")
          PY