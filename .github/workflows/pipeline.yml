on:
  push:
    paths:
      - "incoming/**/*.csv"

jobs:
  stage1:
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.out.outputs.job_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stage 1
        id: out
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace with your real command.
          # Must produce exactly one job id for stage2.
          JOB_ID=$(python -m src.stage1_extract --print-job-id)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Stage1 job_id=$JOB_ID"

  stage2:
    needs: stage1
    if: ${{ needs.stage1.outputs.job_id != '' }}
    uses: ./.github/workflows/stage2_resume_partial.yml
    with:
      job_id: ${{ needs.stage1.outputs.job_id }}
      smoke_test: false
    secrets: inherit