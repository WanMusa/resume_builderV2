on:
  push:
    paths:
      - "incoming/**/*.csv"

permissions:
  contents: read
  models: read
  copilot-requests: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    outputs:
      job_ids: ${{ steps.out.outputs.job_ids }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stage 1
        id: out
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Step 1: parse CSV, insert jobs, capture run_id
          RUN_OUTPUT=$(python -m src.parse_csv)
          echo "$RUN_OUTPUT"
          RUN_ID=$(echo "$RUN_OUTPUT" | grep '^run_id=' | cut -d= -f2)
          echo "run_id=$RUN_ID"

          # Step 2: get pending job ids
          IDS_OUTPUT=$(python -m src.query_by_status --run-id "$RUN_ID" --status pending)
          IDS_JSON=$(echo "$IDS_OUTPUT" | grep '^ids_json=' | cut -d= -f2-)
          echo "pending jobs: $IDS_JSON"

          # Step 3: extract job scope for each pending job
          echo "$IDS_JSON" | python -c "
          import json, sys, subprocess
          ids = json.loads(sys.stdin.read())
          for job_id in ids:
              print(f'Extracting job scope for {job_id}')
              subprocess.run(['python', '-m', 'src.extract_job_scope', '--job-id', job_id], check=False)
          "

          # Step 4: get all extracted job ids for stage2
          EXTRACTED_OUTPUT=$(python -m src.query_by_status --run-id "$RUN_ID" --status extracted)
          EXTRACTED_JSON=$(echo "$EXTRACTED_OUTPUT" | grep '^ids_json=' | cut -d= -f2-)
          echo "job_ids=$EXTRACTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Stage1 job_ids=$EXTRACTED_JSON"

  stage2:
    needs: stage1
    if: ${{ needs.stage1.outputs.job_ids != '[]' && needs.stage1.outputs.job_ids != '' }}
    strategy:
      matrix:
        job_id: ${{ fromJson(needs.stage1.outputs.job_ids) }}
      fail-fast: false
    uses: ./.github/workflows/stage2_resume_partial.yml
    with:
      job_id: ${{ matrix.job_id }}
      smoke_test: false
    secrets: inherit