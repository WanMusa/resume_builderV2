on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string

permissions:
  contents: read
  models: read
  copilot-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      job_ids: ${{ steps.out.outputs.job_ids }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract job scope for scraped jobs
        id: out
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          RUN_ID="${{ inputs.run_id }}"

          SCRAPED_OUTPUT=$(python -m src.query_by_status --run-id "$RUN_ID" --status scraped)
          SCRAPED_JSON=$(echo "$SCRAPED_OUTPUT" | grep '^ids_json=' | cut -d= -f2-)
          echo "scraped jobs: $SCRAPED_JSON"

          echo "$SCRAPED_JSON" | python -c "
          import json, sys, subprocess
          ids = json.loads(sys.stdin.read())
          for job_id in ids:
              print(f'Extracting job scope for {job_id}')
              subprocess.run(['python', '-m', 'src.extract_job_scope', '--job-id', job_id], check=False)
          "

          EXTRACTED_OUTPUT=$(python -m src.query_by_status --run-id "$RUN_ID" --status extracted)
          EXTRACTED_JSON=$(echo "$EXTRACTED_OUTPUT" | grep '^ids_json=' | cut -d= -f2-)
          echo "job_ids=$EXTRACTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Extracted job_ids=$EXTRACTED_JSON"

  stage2:
    needs: extract
    if: ${{ needs.extract.outputs.job_ids != '[]' && needs.extract.outputs.job_ids != '' }}
    strategy:
      matrix:
        job_id: ${{ fromJson(needs.extract.outputs.job_ids) }}
      fail-fast: false
    uses: ./.github/workflows/stage2_resume_partial.yml
    with:
      job_id: ${{ matrix.job_id }}
      smoke_test: false
    secrets: inherit

  stage3:
    needs: [extract, stage2]
    if: ${{ needs.extract.outputs.job_ids != '[]' && needs.extract.outputs.job_ids != '' }}
    strategy:
      matrix:
        job_id: ${{ fromJson(needs.extract.outputs.job_ids) }}
      fail-fast: false
    uses: ./.github/workflows/stage3_cover_letter.yml
    with:
      job_id: ${{ matrix.job_id }}
    secrets: inherit

  stage4:
    needs: [extract, stage3]
    if: ${{ needs.extract.outputs.job_ids != '[]' && needs.extract.outputs.job_ids != '' }}
    strategy:
      matrix:
        job_id: ${{ fromJson(needs.extract.outputs.job_ids) }}
      fail-fast: false
    uses: ./.github/workflows/stage4_render_upload.yml
    with:
      job_id: ${{ matrix.job_id }}
    secrets: inherit