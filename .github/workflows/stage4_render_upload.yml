name: stage4-render-upload

on:
  workflow_call:
    inputs:
      job_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      job_id:
        description: "jobs.id UUID"
        required: true
        type: string

jobs:
  run-stage4:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Lato font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato
          fc-cache -fv

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render and upload documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m src.render_and_upload \
            --job-id "${{ inputs.job_id }}" \
            --bucket "generated-documents"
