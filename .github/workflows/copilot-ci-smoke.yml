name: Copilot CI Smoke Test

on:
  workflow_dispatch:

jobs:
  test-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Show Copilot CLI version
        run: copilot --version

      - name: Copilot prompt smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Reply with exactly: OK" -s --no-ask-user