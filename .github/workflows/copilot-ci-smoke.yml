name: Copilot CI Smoke Test

on:
  workflow_dispatch:

jobs:
  test-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Copilot version
        run: copilot --version

      - name: Copilot login status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot login --check || true

      - name: Copilot prompt smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot -p "Reply with exactly: OK" -s --no-ask-user